<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#f6f8fb"/>

  <!-- Title -->
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Caregiver Alert System (CAS) — Architecture</text>
  <text x="40" y="70" font-size="14" fill="#64748b">Two ingest paths converge on one backend, which fans out to caregiver phones. CAS is additive — the SYNLETT local pager is unaffected.</text>

  <!-- Column headers -->
  <text x="235" y="108" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">INGEST</text>
  <text x="660" y="108" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">BACKEND</text>
  <text x="1045" y="108" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">DELIVERY</text>

  <!-- ============ PATH A ============ -->
  <!-- SYNLETT buttons -->
  <g>
    <rect x="40" y="130" width="120" height="200" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="100" y="152" font-size="12.5" font-weight="700" fill="#1f2733" text-anchor="middle">SYNLETT</text>
    <text x="100" y="168" font-size="11" fill="#64748b" text-anchor="middle">call buttons</text>
    <circle cx="100" cy="200" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="100" y="205" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">B1</text>
    <circle cx="100" cy="240" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="100" y="245" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">B2</text>
    <circle cx="100" cy="280" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="100" y="285" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">B3</text>
  </g>

  <!-- RF arrow -->
  <line x1="162" y1="205" x2="205" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="183" y="196" font-size="9.5" fill="#334155" text-anchor="middle">433 MHz</text>
  <text x="183" y="230" font-size="9.5" fill="#94a3b8" text-anchor="middle">passive</text>

  <!-- Relay Node -->
  <g>
    <rect x="210" y="130" width="245" height="200" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="332" y="153" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Relay Node (ESP32)</text>
    <line x1="228" y1="163" x2="437" y2="163" stroke="#e2e8f0" stroke-width="1"/>
    <text x="228" y="184" font-size="11.5" fill="#334155">• CC1101 433 MHz RX (wake-on-radio)</text>
    <text x="228" y="205" font-size="11.5" fill="#334155">• GNSS / GPS  (+ fixed fallback)</text>
    <text x="228" y="226" font-size="11.5" fill="#334155">• Wi-Fi  — uplink</text>
    <text x="228" y="247" font-size="11.5" fill="#334155">• Battery ≥ 24 h backup (mains norm.)</text>
    <text x="228" y="268" font-size="11.5" fill="#334155">• Local queue + retry, heartbeat</text>
    <text x="228" y="313" font-size="10.5" font-style="italic" fill="#64748b">signs incidents (HMAC + nonce)</text>
  </g>

  <!-- ============ PATH B ============ -->
  <g>
    <rect x="40" y="470" width="415" height="150" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="247" y="494" font-size="14" font-weight="700" fill="#5b21b6" text-anchor="middle">iPhone — Virtual Button</text>
    <line x1="58" y1="504" x2="437" y2="504" stroke="#e2e8f0" stroke-width="1"/>
    <text x="58" y="525" font-size="11.5" fill="#334155">Native iOS (Apple Shortcuts) — no app install</text>
    <text x="58" y="546" font-size="11.5" fill="#334155">Triggers: Home Screen · Back Tap · Action Button</text>
    <text x="58" y="562" font-size="11.5" fill="#334155">· Control Center / Lock Screen · Siri · Watch</text>
    <text x="58" y="586" font-size="11.5" fill="#334155">Captures GPS + timestamp,  source = "virtual"</text>
    <text x="58" y="607" font-size="10.5" font-style="italic" fill="#64748b">bypasses Relay Node — bearer token over TLS</text>
  </g>

  <!-- ============ BACKEND ============ -->
  <g>
    <rect x="530" y="130" width="260" height="490" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <text x="660" y="158" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Backend / Webhook</text>
    <text x="660" y="176" font-size="11" fill="#64748b" text-anchor="middle">(e.g. Azure Function, HTTPS/TLS)</text>

    <rect x="552" y="198" width="216" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="660" y="220" font-size="12" font-weight="600" fill="#1f2733" text-anchor="middle">Authenticate</text>
    <text x="660" y="236" font-size="10" fill="#64748b" text-anchor="middle">HMAC (Path A) · token (Path B)</text>

    <rect x="552" y="256" width="216" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="660" y="278" font-size="12" font-weight="600" fill="#1f2733" text-anchor="middle">De-dup + idempotency</text>
    <text x="660" y="294" font-size="10" fill="#64748b" text-anchor="middle">collapse retries / repeat frames</text>

    <rect x="552" y="314" width="216" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="660" y="336" font-size="12" font-weight="600" fill="#1f2733" text-anchor="middle">Enrich</text>
    <text x="660" y="352" font-size="10" fill="#64748b" text-anchor="middle">reverse-geocode → address + map</text>

    <rect x="552" y="372" width="216" height="46" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="660" y="394" font-size="12" font-weight="600" fill="#1f2733" text-anchor="middle">Subscriber lookup</text>
    <text x="660" y="410" font-size="10" fill="#64748b" text-anchor="middle">tier + channels per button</text>

    <rect x="552" y="430" width="216" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="660" y="452" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Fan-out</text>
    <text x="660" y="468" font-size="10" fill="#7f1d1d" text-anchor="middle">dispatch to channels</text>

    <rect x="552" y="488" width="216" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="660" y="514" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Incident log (audit)</text>

    <rect x="552" y="542" width="216" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    <text x="660" y="562" font-size="11.5" font-weight="600" fill="#475569" text-anchor="middle">Heartbeat / device-down</text>
    <text x="660" y="577" font-size="10" fill="#94a3b8" text-anchor="middle">detect offline Relay Node</text>
  </g>

  <!-- Path A -> Backend -->
  <line x1="455" y1="205" x2="528" y2="215" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="492" y="180" font-size="10" font-weight="600" fill="#2563eb" text-anchor="middle">HTTPS/TLS</text>
  <text x="492" y="194" font-size="9" fill="#2563eb" text-anchor="middle">Wi-Fi</text>

  <!-- Path B -> Backend -->
  <path d="M455,540 C495,540 495,470 528,455" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <text x="500" y="520" font-size="10" font-weight="600" fill="#7c3aed" text-anchor="middle">HTTPS/TLS</text>

  <!-- ============ DELIVERY ============ -->
  <!-- Pushover v1 -->
  <g>
    <rect x="890" y="150" width="310" height="150" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <rect x="890" y="150" width="310" height="26" rx="12" fill="#dc2626"/>
    <rect x="890" y="164" width="310" height="12" fill="#dc2626"/>
    <text x="1045" y="168" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">v1 — PUSH (Pushover)</text>
    <text x="908" y="200" font-size="11.5" fill="#334155">Priority-2 emergency alert</text>
    <text x="908" y="220" font-size="11.5" fill="#334155">re-alerts until acknowledged</text>
    <text x="908" y="240" font-size="11.5" fill="#334155">Content: name · button · location</text>
    <text x="908" y="256" font-size="11.5" fill="#334155">+ map link · timestamp</text>
    <rect x="908" y="268" width="120" height="22" rx="5" fill="#fee2e2"/>
    <text x="968" y="283" font-size="10.5" font-weight="600" fill="#b91c1c" text-anchor="middle">iOS app</text>
    <rect x="1038" y="268" width="140" height="22" rx="5" fill="#fee2e2"/>
    <text x="1108" y="283" font-size="10.5" font-weight="600" fill="#b91c1c" text-anchor="middle">Android app</text>
  </g>

  <!-- SMS/Voice v2 -->
  <g>
    <rect x="890" y="340" width="310" height="130" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1045" y="368" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">v2 — SMS + VOICE</text>
    <text x="908" y="392" font-size="11.5" fill="#475569">SMS to any phone</text>
    <text x="908" y="412" font-size="11.5" fill="#475569">Text-to-voice call (reads incident)</text>
    <text x="908" y="432" font-size="11.5" fill="#475569">Keypress acknowledgement</text>
    <text x="908" y="454" font-size="10.5" font-style="italic" fill="#94a3b8">via voip.ms / Twilio</text>
  </g>

  <!-- Backend -> Pushover -->
  <path d="M790,300 C840,280 850,240 888,225" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="845" y="255" font-size="10" font-weight="600" fill="#dc2626" text-anchor="middle">push</text>

  <!-- Backend -> SMS/Voice -->
  <path d="M790,440 C840,430 850,410 888,405" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>

  <!-- Additive note -->
  <g>
    <rect x="40" y="345" width="415" height="34" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="247" y="366" font-size="11.5" font-weight="600" fill="#047857" text-anchor="middle">↑ SYNLETT pager keeps beeping locally — CAS never breaks it</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="40" y="655" width="1160" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="60" y="680" font-size="12" font-weight="700" fill="#0f172a">Legend</text>

    <line x1="60" y1="702" x2="100" y2="702" stroke="#2563eb" stroke-width="2.5"/>
    <text x="108" y="706" font-size="11" fill="#334155">Path A — physical (SYNLETT → ESP32)</text>

    <line x1="330" y1="702" x2="370" y2="702" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="378" y="706" font-size="11" fill="#334155">Path B — virtual (iPhone)</text>

    <line x1="560" y1="702" x2="600" y2="702" stroke="#dc2626" stroke-width="2.5"/>
    <text x="608" y="706" font-size="11" fill="#334155">v1 delivery (push)</text>

    <line x1="760" y1="702" x2="800" y2="702" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="808" y="706" font-size="11" fill="#334155">v2 delivery (SMS / voice)</text>

    <text x="60" y="730" font-size="10.5" fill="#64748b">Degradation: no GPS → fixed location · no network → local queue + retry · every incident delivered at-least-once, de-duped downstream.</text>
  </g>
</svg>
