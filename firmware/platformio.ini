; Caregiver Alert System — Relay Node firmware (budget build)
; Board: ESP32-WROOM-32D DevKitC, 38-pin, USB-C
;
; Two environments:
;   smoke-test  — hardware bring-up check. RUN THIS FIRST. See docs/SMOKE-TEST.md
;   relay-node  — the real firmware.       See docs/FIRMWARE.md
;
; Framework decision (closes the "Arduino or ESP-IDF — TBD" in CLAUDE.md):
;   Arduino-on-ESP32, built under PlatformIO.
;   Rationale: this is a one-off mains-powered node with no low-power budget to
;   defend, and the CC1101 + HTTPS + NVS work is all covered by mature Arduino
;   libraries. ESP-IDF would buy tighter power control and a better driver model,
;   neither of which this build needs. PlatformIO (rather than the Arduino IDE)
;   keeps library versions pinned and the layout reviewable.

[env]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCAS_FW_VERSION='"0.1.0"'
    -Wall

; ---------------------------------------------------------------------------
; Hardware smoke test. Build and flash this before the real firmware:
;     pio run -e smoke-test -t upload && pio device monitor
; ---------------------------------------------------------------------------
[env:smoke-test]
; Only the smoke test's own source. Excluding the rest keeps this buildable
; even while the main firmware is mid-edit, which is the point of a smoke test.
build_src_filter = +<smoke/>

; ---------------------------------------------------------------------------
; The real firmware.
;     pio run -e relay-node -t upload && pio device monitor
; ---------------------------------------------------------------------------
[env:relay-node]
; Exclude smoke/ or there are two setup()/loop() definitions and the link fails.
build_src_filter = +<*> -<smoke/>

lib_deps =
    ; Two-module CC1101 driver. The SmartRC fork is chosen specifically because
    ; it supports two modules on one SPI bus via setModul(0|1); the upstream
    ; ELECHOUSE library is single-instance only.
    lsatan/SmartRC-CC1101-Driver-Lib @ ^2.5.7
    bblanchon/ArduinoJson @ ^7.0.4
